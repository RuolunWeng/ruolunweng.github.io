name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Disable sparse checkout and fetch all files
        run: |
          git sparse-checkout disable
          git checkout master
          echo "=== Root directory ==="
          ls -la | head -20
          echo "=== Checking faustide directory ==="
          if [ -d "faustide" ]; then
            echo "faustide directory exists!"
            ls -la faustide/ | head -20
          else
            echo "ERROR: faustide directory NOT found!"
            exit 1
          fi
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
